[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rustuya-local"
version = "0.0.5"
description = "Local Tuya control: rustuya-bridge -> tuya2ildevice -> IL (ildevice). HA-independent core."
requires-python = ">=3.13"
license = "MIT"
dependencies = ["tuya2ildevice[host]>=0.2.0,<0.3", "pyrustuyabridge>=0.3.0,<0.4"]
# rustuya-manager (custom_components/rustuya's config flow) is optional at the package level (the HA manifest
# pulls it in); declared here too so the venv used for this repo's tests has it. pyrustuyabridge is a base dependency
# now (not just for the embedded bridge): rustuya-local's own bridge_client uses it to interpret rustuya-bridge's
# configurable MQTT topic/payload templates correctly, for BOTH bridge modes.

[project.scripts]
rustuya-local = "rustuya_local.cli:main"

# With rustuya-manager in the same environment, its plugin host finds this and runs the service under the manager
[project.entry-points."rustuya_manager.plugins"]
rustuya-local = "rustuya_local.manager_plugin:register"

[project.optional-dependencies]
discovery = ["il-ha"]         # Home Assistant MQTT discovery (`rustuya_local.discovery`) plans entities with il-ha's core
test = ["pytest", "pytest-asyncio", "il-ha"]      # il-ha: the IL consumer the end-to-end tests read the result with
test-ha = ["pytest-homeassistant-custom-component"]   # custom_components/rustuya's own tests
fullstack = ["tuyamock"]      # the device emulator, for tests/e2e/test_full_stack*.py (pyrustuyabridge is now a base dep)

# Local sibling checkouts until the packages are on PyPI. tuya2ildevice is on PyPI now (see `dependencies` above);
# the rest are not yet.
[tool.uv.sources]
il-ha = { path = "../il-ha", editable = true }
tuyamock = { path = "../tuyamock", editable = true }
rustuya-manager = { path = "../rustuya-manager", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/rustuya_local"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests/e2e", "."]
