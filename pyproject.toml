[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rustuya-local"
version = "0.1.2"
description = "Local Tuya control: rustuya-bridge -> tuya-interpreter -> IL (ildevice). HA-independent core."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = ["tuya-interpreter>=0.1.0", "pyrustuyabridge>=0.4.0", "paho-mqtt>=2.0"]

[project.urls]
Homepage = "https://github.com/3735943886/rustuya-local"
Repository = "https://github.com/3735943886/rustuya-local"
Issues = "https://github.com/3735943886/rustuya-local/issues"

[project.scripts]
rustuya-local = "rustuya_local.cli:main"

# With rustuya-manager in the same environment, its plugin host finds this and runs the service under the manager
[project.entry-points."rustuya_manager.plugins"]
rustuya-local = "rustuya_local.manager_plugin:register"

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "ildevice-homeassistant", "httpx2"]      # ildevice-homeassistant: the IL consumer; httpx2: Starlette TestClient
test-ha = ["pytest-homeassistant-custom-component"]   # Home Assistant integration tests
fullstack = ["tuyamock"]      # device emulator for full-stack tests
manager = ["rustuya-manager[web]>=0.2.3"]      # tests/e2e/test_manager_plugin*.py: the manager's real plugin host, its web app

[tool.hatch.build.targets.wheel]
packages = ["src/rustuya_local"]

[tool.ruff]
required-version = ">=0.16"      # CI pins 0.16.8; older ones disagree on some rules

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests/e2e", "."]
