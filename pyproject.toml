[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rustuya-local"
version = "0.0.1.dev0"
description = "Local Tuya control: rustuya-bridge -> tuya2ildevice -> IL (ildevice). HA-independent core."
requires-python = ">=3.13"
license = "MIT"
dependencies = ["tuya2ildevice[host]"]
# rustuya-manager (custom_components/rustuya_local's config flow) and pyrustuyabridge (embedded bridge) are optional
# at the package level (the HA manifest pulls them in); declared here too so the venv used for this repo's tests has them.

[project.scripts]
rustuya-local = "rustuya_local.cli:main"

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "il-ha"]      # il-ha: the IL consumer the end-to-end tests read the result with
test-ha = ["pytest-homeassistant-custom-component"]   # custom_components/rustuya_local's own tests
fullstack = ["pyrustuyabridge>=0.3.0,<0.4", "tuyamock"]      # the real bridge and the device emulator, for tests/e2e/test_full_stack*.py

# Local sibling checkouts until the packages are on PyPI.
[tool.uv.sources]
tuya2ildevice = { path = "../tuya2ildevice", editable = true }
il-ha = { path = "../il-ha", editable = true }
tuyamock = { path = "../tuyamock", editable = true }
rustuya-manager = { path = "../rustuya-manager", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/rustuya_local"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests/e2e", "."]
