name: Test (reusable)

# Single source of truth for rustuya-local's pre-merge / pre-publish checks. Called from ci.yml
# on push/PR and as a gate from release.yml, so a commit that fails these can't reach PyPI.
#
# il-ha is not on PyPI yet, so check out ildevice-homeassistant and explicitly
# install that checkout together with rustuya-local's test extras.
# Other package dependencies are installed from PyPI.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # il-ha (the test/fullstack sibling dep) requires Python>=3.14; rustuya-local's own
        # requires-python floor (3.13, in pyproject.toml) stays lower since only the test extras
        # need 3.14, not the base package.
        python-version: ["3.14"]

    steps:
      - name: Check out rustuya-local
        uses: actions/checkout@v7
        with:
          path: rustuya-local

      # The repository publishes its Python package under the name il-ha.
      - name: Check out ildevice-homeassistant
        uses: actions/checkout@v7
        with:
          repository: 3735943886/ildevice-homeassistant
          path: ildevice-homeassistant

      # tuya2ildevice is on PyPI (installed below via uv), so this isn't for dependency
      # resolution -- it's so tests/e2e/test_full_stack_devices.py can reach its sibling
      # checkout's tests/golden fixture data, which isn't shipped in the published package.
      - name: Check out tuya2ildevice
        uses: actions/checkout@v7
        with:
          repository: 3735943886/tuya2ildevice
          path: tuya2ildevice

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install + start mosquitto
        # tests/ha/ and tests/e2e/ each skip gracefully (pytest.skip / importorskip) when
        # mosquitto, pyrustuyabridge or tuyamock is missing (see their conftest.py) -- installed
        # here so CI actually exercises those tests instead of silently skipping them.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mosquitto mosquitto-clients
          sudo tee /etc/mosquitto/conf.d/ci.conf > /dev/null <<'EOF'
          listener 1883
          allow_anonymous true
          EOF
          sudo systemctl restart mosquitto
          for _ in $(seq 1 20); do
            if mosquitto_sub -h localhost -t '$SYS/broker/version' -C 1 -W 2 >/dev/null 2>&1; then
              echo "mosquitto reachable"
              exit 0
            fi
            sleep 0.5
          done
          echo "mosquitto did not become reachable"
          sudo journalctl -u mosquitto --no-pager | tail -50
          exit 1

      - name: Install rustuya-local + test extras
        working-directory: rustuya-local
        run: uv pip install --system -e ../ildevice-homeassistant -e ".[test,test-ha,fullstack,manager]"

      - name: ruff
        working-directory: rustuya-local
        run: uv pip install --system ruff==0.16.8 && ruff check src tests custom_components scripts

      - name: pytest
        working-directory: rustuya-local
        run: pytest -q

  package:
    # The test job uses an il-ha checkout; this one checks what a user gets: the wheel in a fresh
    # environment, every dependency from PyPI, importing and starting the CLI.
    name: installs from PyPI alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build the wheel
        run: python -m pip install build && python -m build --wheel

      - name: Install it into a fresh venv and import it
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/python" -c "
          import rustuya_local.cli, rustuya_local.manager_plugin, rustuya_local.service
          from rustuya_local import register
          import tuya2ildevice
          tuya2ildevice.preload()
          print('ok')"
          "$RUNNER_TEMP/smoke/bin/rustuya-local" --help
