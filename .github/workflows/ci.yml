name: CI

# Runs on PRs targeting master and on direct pushes to master.
# The actual pytest matrix lives in _test.yml so the same checks also run as a
# pre-flight gate inside release.yml.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/_test.yml
